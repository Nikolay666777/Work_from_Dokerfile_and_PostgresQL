services:
  - type: web
    name: hw_final
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hw_final_db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hw_final_redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: hw_final_db
    databaseName: hw_final
    plan: free

  - type: redis
    name: hw_final_redis
    ipAllowList: []
    plan: free
